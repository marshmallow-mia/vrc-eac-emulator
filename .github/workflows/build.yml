name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Limit GITHUB_TOKEN permissions to minimum required
permissions:
  contents: read

jobs:
  build-mingw:
    name: Build with MinGW (Cross-compile for Wine)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build mingw-w64
    
    - name: Configure CMake for MinGW cross-compilation
      run: |
        cat > mingw-toolchain.cmake << 'EOF'
        set(CMAKE_SYSTEM_NAME Windows)
        set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc)
        set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
        set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
        set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32)
        set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
        set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
        set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
        EOF
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=mingw-toolchain.cmake
    
    - name: Build
      run: |
        cmake --build build --config Release
    
    - name: List build artifacts
      run: |
        find build -name "*.dll" || echo "No DLL files found"
    
    - name: Upload MinGW build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mingw-build
        path: |
          build/src/win/*.dll
          build/src/linux/*.dll
        if-no-files-found: warn

  build-windows:
    name: Build with MSVC (Native Windows)
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup CMake
      uses: lukka/get-cmake@latest
    
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: |
        cmake --build build --config Release
    
    - name: List build artifacts
      run: |
        Get-ChildItem -Path build -Recurse -Include *.dll
    
    - name: Upload Windows build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          build/src/win/Release/*.dll
          build/src/linux/Release/*.dll
          build/src/win/*.dll
          build/src/linux/*.dll
        if-no-files-found: warn
